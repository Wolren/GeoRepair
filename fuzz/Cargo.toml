[package]
name = "geo-repair-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
geo = "0.33"
geo-repair = { path = "..", features = ["arrange", "structure", "parallel", "simd", "validate", "io-wkt", "io-wkb"] }

# The crate's [profile.release] sets panic = "abort" (perf). The fuzz
# harness MUST unwind: the targets and the library's own containment
# guards (arrange::build_cdt_safe) rely on catch_unwind to convert a
# repair panic into a reported fuzz failure. With abort the panic kills
# the process as a "deadly signal" (measured 2026-08-04: spade CDT
# 'vertex insertion failed: TooLarge' on the mixed-magnitude corpus
# seeds escaped and aborted the smoke). The unwind profile alone is not
# enough: libfuzzer-sys's initialize installs a panic hook that aborts
# the process BEFORE unwinding, which would defeat every catch_unwind
# (measured: fuzz-nightly run 35499180884 on 2026-09-20 crashed on an
# i_overlay assertion that merge_shells contained correctly under plain
# cargo test). fuzz/fuzz_support.rs re-installs a non-aborting hook;
# every target calls it first. Escaped and target-raised panics still
# abort at libfuzzer-sys's test_input_wrap, so genuine failures remain
# crash artifacts.
[profile.release]
panic = "unwind"

# Prevent this crate from accidentally being used as a normal dependency.
[workspace]

[[bin]]
name = "make_valid"
path = "fuzz_targets/make_valid.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wkt_repair"
path = "fuzz_targets/wkt_repair.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wkb_repair"
path = "fuzz_targets/wkb_repair.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
