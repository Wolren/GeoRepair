[package]
name = "geo-repair"
description = "Fix invalid GIS geometries in parallel using rewritten GEOS/JTS repair module"
version = "0.14.2"
license = "Apache-2.0"
repository = "https://github.com/Wolren/GeoRepair"
homepage = "https://github.com/Wolren/GeoRepair"
documentation = "https://docs.rs/geo-repair"
readme = "README.md"
keywords = ["gis", "geo", "validation", "repair", "no-std"]
categories = ["science::geo"]
edition = "2024"
rust-version = "1.88"
exclude = ["tests/*.py", "*.py", ".history/",
    "benches/real_world/*.bin", "benches/real_world/*.shp",
    "benches/real_world/*.shx", "benches/real_world/*.dbf",
    "benches/real_world/*.prj", "benches/real_world/*.cpg",
    "benches/real_world/*.gpkg", "benches/real_world/*.qmd",
    "benches/real_world/*.geojson"]

# docs.rs must not build all-features: simd-portable needs nightly and
# bench-geos-system needs a system GEOS install. Document the library
# surface (defaults + the format backends + serde) instead.
[package.metadata.docs.rs]
all-features = false
features = ["std", "arrange", "structure", "parallel", "simd", "validate", "mimalloc", "io-all", "io-gpkg", "serde", "geo-traits"]

[features]
default = ["std", "arrange", "structure", "parallel", "simd", "validate", "mimalloc"]

# no_std support: disable `std` feature to build without file I/O,
# alloc-only. WKB parsing, geometry validation, and repair work
# without std — only file/network I/O requires it.
std = ["thiserror/std"]
rstar = ["dep:rstar"]
# The two repair strategies are a coupled pair: Structure's boolean
# subtract uses Arrange's overlap helpers, and Arrange's Auto dispatch
# falls back to Structure's fast path. Each implies the other; enabling
# either alone was never a supported configuration.
arrange = ["dep:spade", "geo/spade", "rstar", "structure"]
structure = ["simd", "rstar", "arrange"]
validate = ["rstar"]
parallel = ["dep:rayon", "geo/multithreading"]
# SIMD acceleration
# - `simd`: retained for backward compatibility. Stable builds use scalar
#   kernels that LLVM auto-vectorizes — hand-written AVX2 intrinsics were
#   measured slower on AoS coordinate data and removed (see src/simd/mod.rs).
# - `simd-portable`: `core::simd` on all platforms (requires nightly)
simd = []
simd-portable = []

# Built-in WKB parser is always available — no extra deps needed
bench-geos = ["geos/static"]
bench-geos-system = ["dep:geos"]

python = ["dep:pyo3", "geo/serde"]
ffi = ["dep:wkb", "geo-traits"]
# geo-traits GeometryTrait/GeometryCollectionTrait interop surface. Lets any
# geometry source that implements geo-traits (geo, geoarrow, geozero, wkb)
# drive the validation and repair engines without materializing geo types.
geo-traits = ["dep:geo-traits"]

# WASM browser fetch (synchronous XHR — blocks main thread)
wasm = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]

proj = ["geo/proj"]
serde = ["geo/serde"]

# Optional format backends
io-shp = ["dep:shapefile"]
io-wkt = []
io-csv = ["dep:csv", "io-wkt"]
io-gml = ["dep:quick-xml"]
io-gpkg = ["dep:rusqlite"]
io-all = ["io-shp", "io-wkt", "io-csv", "io-gml"]
# gpkg requires C compilation (bundled SQLite), not available on WASM
# No-op features: always compiled in, kept for CI compatibility
io-geojson = []
io-wkb = []

io-all-native = ["io-all", "io-gpkg"]

memmap = ["dep:memmap2"]

# Function-level profiling via hotpath-rs (zero-cost when disabled)
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dependencies]
geo = { version = "0.33", default-features = false }
spade = { version = "2.15", optional = true }
rstar = { version = "0.13", optional = true }
log = { version = "0.4", default-features = false }
robust = "1.2"
thiserror = { version = "2.0", default-features = false }
rustc-hash = "2.1"
smallvec = { version = "1.15", default-features = false, features = ["union"] }
serde_json = "1.0"
shapefile = { version = "0.8", features = ["geo-types"], optional = true }
csv = { version = "1.3", optional = true }
quick-xml = { version = "0.41", optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
memmap2 = { version = "0.9.11", optional = true }
geo-traits = { version = "0.3", optional = true }
wkb = { version = "0.9", optional = true }
ryu = "1.0"
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "XmlHttpRequest", "Window", "ProgressEvent", "console",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.12", optional = true }
geos = { version = "11.1", optional = true, default-features = false, features = ["v3_8_0"] }
mimalloc = { version = "0.1", default-features = false, optional = true }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
hotpath = { version = "0.22", optional = true }

[dev-dependencies]
proptest = "1.11"
wkt = { version = "0.14", features = ["geo-types"] }
wkb = { version = "0.9" }
geo-traits = { version = "0.3" }

[lib]
name = "geo_repair"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "geo-repair-cli"
path = "src/main.rs"
required-features = ["std"]

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "real_world"
harness = false

[[bench]]
name = "wkt_iobench"
harness = false

[[bench]]
name = "wkb_cmp"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1
panic = "abort"
