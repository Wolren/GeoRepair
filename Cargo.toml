[package]
name = "geo-repair"
description = "Fix invalid GIS geometries using optimal algorithms per type: CDT arrangement for polygons, noding for lines, structure method as fast path"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/Wolren/geo-repair"
keywords = ["gis", "geo", "geospatial", "validation", "repair"]
categories = ["science::geo"]
edition = "2024"
rust-version = "1.95"

[features]
default = ["arrange", "structure", "parallel", "simd", "io-geojson", "io-wkt"]
arrange = ["dep:spade", "geo/spade"]
structure = []
parallel = ["dep:rayon", "geo/multithreading"]
simd = []
bench-geos = ["dep:geos", "geos/static", "load-shp"]
bench-criterion = []
load-shp = ["dep:shapefile"]
io-geojson = ["dep:geojson", "dep:serde_json", "serde_json/arbitrary_precision"]
io-wkt = ["dep:wkt"]
io-wkb = ["dep:wkb", "dep:geo-traits"]
io-csv = ["dep:csv"]
io-all = ["io-geojson", "io-wkt", "io-wkb", "io-csv"]
serde = ["geo/serde"]
ffi = ["io-wkb"]

[dependencies]
geo = { version = "0.33", default-features = false }
spade = { version = "2.15", optional = true }
rstar = { version = "0.12" }
rayon = { version = "1.12", optional = true }
log = { version = "0.4", default-features = false }

robust = "1.2"
thiserror = "2.0"
rustc-hash = "2.1"
smallvec = { version = "1.15", default-features = false, features = ["union"] }
mimalloc = { version = "0.1", default-features = false, optional = true }
geos = { version = "11.1", optional = true, features = ["v3_8_0"] }

geojson = { version = "1.0", features = ["geo-types"], optional = true }
serde_json = { version = "1.0", optional = true }
wkt = { version = "0.14", features = ["geo-types"], optional = true }
wkb = { version = "0.9", optional = true }
geo-traits = { version = "0.3", optional = true }
csv = { version = "1.4", optional = true }

[dependencies.shapefile]
version = "0.8"
features = ["geo-types"]
optional = true

[dev-dependencies]
wkt = { version = "0.14", features = ["geo-types"] }
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11"
[[bench]]
name = "bench"
harness = false

[[bench]]
name = "real_world"
harness = false

[[bench]]
name = "criterion"
harness = false
required-features = ["bench-criterion"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "fat"
codegen-units = 1
panic = "abort"

[patch.crates-io]
geos-src = { path = "patches/geos-src" }
