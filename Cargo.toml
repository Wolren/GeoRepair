[package]
name = "geo-repair"
description = "Fix invalid GIS geometries in parallel using rewritten GEOS/JTS repair module"
version = "0.14.4"
license = "Apache-2.0"
repository = "https://github.com/Wolren/GeoRepair"
homepage = "https://github.com/Wolren/GeoRepair"
documentation = "https://docs.rs/geo-repair"
readme = "README.md"
keywords = ["gis", "geo", "validation", "repair", "no-std"]
categories = ["science::geo"]
edition = "2024"
rust-version = "1.88"
exclude = ["tests/*.py", "*.py", ".history/",
    "benches/real_world/*.bin", "benches/real_world/*.shp",
    "benches/real_world/*.shx", "benches/real_world/*.dbf",
    "benches/real_world/*.prj", "benches/real_world/*.cpg",
    "benches/real_world/*.gpkg", "benches/real_world/*.qmd",
    "benches/real_world/*.geojson"]

# docs.rs must not build all-features: simd-portable needs nightly and
# bench-geos-system needs a system GEOS install. Document the library
# surface (defaults + the format backends + serde) instead.
[package.metadata.docs.rs]
all-features = false
features = ["std", "arrange", "structure", "parallel", "simd", "validate", "mimalloc", "io-all", "io-gpkg", "serde", "geo-traits"]

[features]
default = ["std", "arrange", "structure", "parallel", "simd", "validate", "mimalloc", "io-gpkg"]

# no_std support: disable `std` feature to build without file I/O,
# alloc-only. WKB parsing, geometry validation, and repair work
# without std — only file/network I/O requires it.
std = ["thiserror/std", "fast-float2/std"]
rstar = ["dep:rstar"]
# The two repair strategies are a coupled pair: Structure's boolean
# subtract uses Arrange's overlap helpers, and Arrange's Auto dispatch
# falls back to Structure's fast path. Each implies the other; enabling
# either alone was never a supported configuration.
arrange = ["dep:spade", "geo/spade", "rstar", "structure"]
structure = ["simd", "rstar", "arrange"]
validate = ["rstar"]
parallel = ["dep:rayon", "geo/multithreading", "std"]
# SIMD acceleration
# - `simd`: retained for backward compatibility. Stable builds use scalar
#   kernels that LLVM auto-vectorizes — hand-written AVX2 intrinsics were
#   measured slower on AoS coordinate data and removed (see src/simd/mod.rs).
# - `simd-portable`: `core::simd` on all platforms (requires nightly)
simd = []
simd-portable = []

# Built-in WKB parser is always available — no extra deps needed
bench-geos = ["geos/static", "std"]
bench-geos-system = ["dep:geos", "std"]

python = ["dep:pyo3", "geo/serde", "std"]
ffi = ["dep:wkb", "geo-traits", "std"]
# geo-traits GeometryTrait/GeometryCollectionTrait interop surface. Lets any
# geometry source that implements geo-traits (geo, geoarrow, geozero, wkb)
# drive the validation and repair engines without materializing geo types.
geo-traits = ["dep:geo-traits"]

# WASM browser fetch (synchronous XHR — blocks main thread)
wasm = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]

proj = ["geo/proj"]
serde = ["geo/serde"]

# Optional format backends (file I/O — all imply `std`)
io-shp = ["dep:shapefile", "std"]
io-wkt = []
io-csv = ["dep:csv", "io-wkt", "std"]
io-gml = ["dep:quick-xml", "std"]
# GeoPackage is a DEFAULT feature (bundled SQLite, target-gated below):
# `geo_repair::io::load("*.gpkg")` works out of the box. WASM targets skip
# the module (the dep is in the non-wasm target block).
io-gpkg = ["dep:rusqlite", "std"]
io-all = ["io-shp", "io-wkt", "io-csv", "io-gml"]
# No-op features: always compiled in, kept for CI compatibility
io-geojson = []
io-wkb = []

io-all-native = ["io-all", "io-gpkg"]

memmap = ["dep:memmap2", "std"]

# Function-level profiling via hotpath-rs (zero-cost when disabled)
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dependencies]
geo = { version = "0.33", default-features = false }
spade = { version = "2.15", optional = true }
rstar = { version = "0.13", optional = true }
log = { version = "0.4", default-features = false }
robust = "1.2"
thiserror = { version = "2.0", default-features = false }
rustc-hash = "2.1"
num-traits = { version = ">=0.2,<0.3", default-features = false }
smallvec = { version = "1.15", default-features = false, features = ["union"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
shapefile = { version = "0.8", features = ["geo-types"], optional = true }
csv = { version = "1.3", optional = true }
quick-xml = { version = "0.41", optional = true }
memmap2 = { version = "0.9.11", optional = true }
geo-traits = { version = "0.3", optional = true }
# fast-float2: maintained fork of fast-float (same Eisel-Lemire algorithm)
# carrying the RUSTSEC-2024-0379 (unsound) and RUSTSEC-2025-0003 (empty
# input segfault) fixes; fast-float itself is unmaintained with no patched
# release.
fast-float2 = { version = ">=0.2.3,<0.3", default-features = false }
wkb = { version = "0.9", optional = true }
ryu = "1.0"
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "XmlHttpRequest", "XmlHttpRequestResponseType", "Window", "ProgressEvent", "console",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.12", optional = true }
geos = { version = "11.1", optional = true, default-features = false, features = ["v3_8_0"] }
mimalloc = { version = "0.1", default-features = false, optional = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }
hotpath = { version = "0.22", optional = true }
# Bundled SQLite compiles C - no WASM toolchain can build it. The io-gpkg
# feature stays a plain dep: marker; on wasm32 the dep simply does not
# exist and the module is gated out in src/io/mod.rs.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[dev-dependencies]
wkt = { version = "0.14", features = ["geo-types"] }
wkb = { version = "0.9" }
geo-traits = { version = "0.3", features = ["geo-types"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# proptest is native-only: its rusty-fork -> wait-timeout chain does not
# compile on wasm32-unknown-unknown (no `imp` module), and the wasm suite
# does not use it. Native test suites keep it.
proptest = "1.11"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# wasm-bindgen-test harness: `cargo test --target wasm32-unknown-unknown`
# runs the tests/wasm.rs suite in Node via the wasm-bindgen-test-runner
# (installed from the matching wasm-bindgen-cli release).
wasm-bindgen-test = "0.3"
# getrandom 0.3 rejects wasm32-unknown-unknown unless the js backend is
# enabled; proptest/rand pull it transitively as dev-deps and cargo builds
# every declared dev-dependency for a test target, even unused ones.
getrandom = { version = "0.3", features = ["wasm_js"] }

[lib]
name = "geo_repair"
# cdylib + staticlib so C consumers can link dynamically or statically;
# `lib` keeps the rlib for Rust consumers.
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "geo-repair-cli"
path = "src/main.rs"
required-features = ["std"]

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "real_world"
harness = false

[[bench]]
name = "wkt_iobench"
harness = false

[[bench]]
name = "wkb_cmp"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
# MUST stay "unwind": the C FFI (src/bindings/ffi.rs) documents panic
# safety via catch_unwind, which is a no-op under panic=abort and would
# abort the host process on any internal panic. The bench profile keeps
# panic=abort for measurement stability.
panic = "unwind"

[profile.bench]
lto = "fat"
codegen-units = 1
panic = "abort"

[package.metadata.cargo-semver-checks.lints]
# 0.14.2: GeoRepairResult (C FFI result struct, ffi feature) gained the
# error_code field and reordered error_msg. Deliberate ABI evolution - the
# contract is include/geo_repair.h, consumers recompile against the header,
# and the struct is only exposed behind the ffi feature. Version stays on
# the 0.14.2 line per the release plan.
constructible_struct_adds_field = "allow"
