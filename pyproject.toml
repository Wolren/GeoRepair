[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "geo_repair"
description = "Fix invalid GIS geometries — Python bindings for geo-repair"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[tool.maturin]
features = ["arrange", "structure", "python", "load-shp"]
module-name = "geo_repair"
