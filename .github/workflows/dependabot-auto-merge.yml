name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      # No approval step: the repo Actions setting forbids GitHub
      # Actions from approving PRs and branch protection requires
      # zero reviews (required_approving_review_count: 0), so
      # approval is neither possible nor needed here.
      # Needs repo setting "Allow auto-merge" enabled; without it this
      # step failed with "Auto merge is not allowed for this repository".
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
