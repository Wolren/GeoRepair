name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

# All actions SHA-pinned (supply-chain gate 3: unpinned refs are mutable
# supply-chain risk; pins verified against the tagged release HEADs on
# 2026-08-04). Bump by re-resolving the tag, never by trusting a new tag.
jobs:
  # Guards the private working config out of the tree and its history. Kept first
  # so a leaked file fails before the expensive jobs start.
  private-config:
    name: private config guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
        with:
          fetch-depth: 0
      - name: Block the private commentkit config
        run: |
          set -e
          if git ls-files | grep -iE '(^|/)\.commentkit\.toml$|(^|/)\.commentkit/'; then
            echo "::error::.commentkit.toml is private working config. Untrack it and add it to .gitignore."
            exit 1
          fi
          if git log --all --oneline -- .commentkit.toml | head -5 | grep .; then
            echo "::error::Commit history contains .commentkit.toml. Remove it with git filter-repo."
            exit 1
          fi
          echo "no private config found"

  # MSRV + no_std gate: rust-version = 1.88 (the floor set by geo 0.33.1) and
  # the alloc-only configs must both build. io backends and ffi are excluded
  # because they pull newer transitive deps.
  compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # 1.88
        with:
          toolchain: "1.88"
      - run: cargo check --locked --features "arrange,structure,parallel,simd,validate"
      - run: cargo check --locked --features "arrange,structure,parallel,simd,validate,geo-traits"
      - run: cargo check --locked --no-default-features
      - run: cargo check --locked --no-default-features --features validate
      - run: cargo check --locked --no-default-features --features validate,structure,arrange

  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            args: --features "arrange,structure,parallel,simd,io-geojson,io-wkt,io-wkb,io-csv,io-gpkg,io-gml,io-shp,ffi"
          - name: no-defaults
            args: --no-default-features --features "arrange,structure,parallel,simd,validate"
          - name: serde
            args: --features "serde"
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libgeos-dev geos-bin
      - run: cargo test --locked ${{ matrix.args }}

  # Branch protection requires a check named exactly `test`; the matrix legs are
  # `tests (full)` and friends, so this aggregator carries the required name.
  test:
    name: test
    needs: [tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.tests.result }}" = "success"

  # Python bindings gate: build the maturin wheel and run the WKT-surface
  # test suite (tests/test_python.py) against the real wheel.
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
      - run: pip install maturin pytest
      - run: maturin build --release
      - run: pip install --force-reinstall target/wheels/*.whl
      - run: pytest tests/test_python.py -q

  # Real-GEOS oracle gate: runs geos_compare (geosop makeValid comparisons on
  # every fixture), alaska_fixture (GEOS-validity + area-preservation on the
  # real-world dataset) and geos_differential (random-polygon differential
  # fuzz: one-directional invariants vs GEOS isValid, repair output must be
  # GEOS-valid, no panics) against the system GEOS install. geosop and the
  # alaska test data are committed; alaska.bin is regenerable via
  # scripts/convert_shp_to_bin.py.
  test-geos-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libgeos-dev geos-bin
      - run: cargo test --locked --features "arrange,structure,parallel,simd,validate,bench-geos-system" --test geos_compare --test alaska_fixture
      - name: Differential fuzz vs GEOS (one-directional invariants)
        run: cargo test --locked --features "arrange,structure,parallel,simd,validate,bench-geos-system" --test geos_differential
        env:
          PROPTEST_CASES: 1000

  # OGC conformance against GDAL, an implementation we do not own. Every comparison is made
  # on OGR's bytes or OGR's reading of our bytes, so the crate cannot mark its own homework.
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin
      # shapely brings GEOS: check M judges validity of what we hand a host, not our own verdict.
      - run: python3 -m pip install --upgrade pip shapely
      - run: cargo build --locked --example conformance_dump
      - run: python3 conformance/run.py

  # Regression gate: the synthetic bench's curated subset must stay within
  # threshold of the committed baseline (recorded on this runner type).
  # Added 2026-08-07 after the LineString validity-contract fix shipped a
  # 35x valid-line regression with a fully green CI - nothing measured the
  # bench, so nothing caught it. First run on a new baseline records it;
  # commit the artifact to benches/bench_baseline.json.
  bench-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - name: Synthetic bench subset (gate)
        run: cargo bench --locked --features arrange,structure,parallel,simd --bench bench
        env:
          BENCH_SUBSET: "valid polygon 1000v,valid polygon 5000v,valid polygon 10000v,invalid bowtie 4v,invalid bowtie 50v,invalid bowtie 100v,invalid bowtie 500v,invalid bowtie 1000v,spaghetti 500v,spaghetti 2000v,self-touch 1000v,collapsed 1000v,near-collinear 1000v,large coord 1e12 1000v,star poly 1000v,valid ls 100v,valid ls 500v,valid ls 1000v,collinear ls 1000v,zigzag ls 1000v,spiral ls 1000v,self-int ls 1000v,dense self ls 1000v,duped ls 1000v,mls 500x3v,self-int mls 500x4v,star-burst 1000sp,collinear ov 1000seg,x-scale 1000v,ringing 1000v,lissajous 2000v,spoke 1000sp,star-comb 1000sp,hole hier 100h,overlap mp 100sh,dense grid 10x10=100,dense grid 20x20=400,dense grid 30x30=900,sliver 1000v,arrange valid 1000v"
          BENCH_JSON: target/bench_gate.json
      - name: Compare against baseline
        run: python scripts/bench_gate.py --json target/bench_gate.json --baseline benches/bench_baseline.json
      - name: Upload recorded baseline (when the first run created it)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v4
        with:
          name: bench-baseline
          path: benches/bench_baseline.json
          if-no-files-found: ignore
          retention-days: 7

  # WebAssembly gate: the crate claims wasm32 support (default features
  # minus C-bound deps; the `wasm` feature adds browser fetch). Both the
  # full default feature set and the minimal wasm config must compile, and
  # the runtime suite (tests/wasm.rs) must PASS in Node via
  # wasm-bindgen-test-runner - compile-only wasm support rots (the
  # mimalloc E0433 was only found the first time the target was actually
  # checked, 2026-08-06).
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --target wasm32-unknown-unknown
      - run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features "std,arrange,structure,simd,validate,wasm"
      - name: Install wasm-bindgen-test-runner (version-locked to the lockfile)
        run: |
          wb=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | sed 's/version = "\(.*\)"/\1/')
          cargo install wasm-bindgen-cli --version "$wb" --locked
      - name: Runtime wasm tests in Node
        run: cargo test --locked --target wasm32-unknown-unknown --features "arrange,structure,simd,validate,wasm" --test wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  # C FFI gate: build the cdylib/staticlib and compile + run the C
  # harness (tests/c/test_geo_repair.c) against it on Linux and Windows
  # on every push. This catches ABI/layout drift at commit time, not at
  # release time (the release workflow re-runs the harness on macOS too).
  c-ffi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - run: cargo build --locked --release --features ffi,parallel
      - name: Compile + run C harness (Linux)
        if: runner.os != 'Windows'
        run: |
          gcc -std=c99 -Wall -Wextra -I include tests/c/test_geo_repair.c \
            -L target/release -l geo_repair -o target/release/gr_test
          LD_LIBRARY_PATH=target/release target/release/gr_test
      - name: Compile + run C harness (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: tests\c\build_test_windows.bat

  # Lint gate: rustfmt + clippy on ALL targets (lib, tests, benches,
  # examples) under the full non-GEOS feature set. --all-targets matches
  # the geo ecosystem's gate (geo, wkt run it) - the CI feature set is the
  # one the tests job uses, so every target that ships gets linted.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (all targets)
        run: cargo clippy --locked --features "arrange,structure,parallel,simd,io-geojson,io-wkt,io-wkb,io-csv,io-gpkg,io-gml,io-shp,ffi" --all-targets -- -D warnings
      # Version drift gate: the maturin pyproject version must track Cargo.toml.
      - name: Version drift (Cargo.toml vs pyproject.toml)
        run: |
          cargo_v=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          py_v=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$cargo_v" != "$py_v" ]; then
            echo "version drift: Cargo.toml=$cargo_v pyproject.toml=$py_v"
            exit 1
          fi

  # Docs gate: stable rustdoc lints + the docs.rs nightly build. Stable and
  # nightly do not agree on what is a broken link, so both run in one job.
  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # nightly
        with:
          toolchain: nightly
      - run: rustup toolchain install stable --profile minimal
      - name: Stable rustdoc (default features)
        run: cargo +stable doc --locked
      - name: Stable rustdoc (full feature set)
        run: cargo +stable doc --locked --features "arrange,structure,parallel,simd,io-geojson,io-wkt,io-wkb,io-csv,io-gpkg,io-gml,io-shp,ffi,serde"
      - uses: dtolnay/install@a75ae3c3a13004d4d2db69b04946c7f7687bda91  # cargo-docs-rs
        with:
          crate: cargo-docs-rs
      - name: docs.rs metadata build
        run: cargo docs-rs

  # Supply-chain gate: license policy + sources + advisories via
  # cargo-deny (policy in deny.toml at the repo root). Explicit install +
  # invocation: the cargo-deny-action bundle historically shipped an old
  # cargo-deny whose `check` rejected the multi-check argument form
  # (measured 2026-08-04: "unrecognized subcommand 'licenses'" with
  # command=check + arguments="licenses advisories sources").
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Deny checks
        run: cargo deny check licenses advisories sources

  # libFuzzer smoke gate: the repair entry points must build under
  # cargo-fuzz and survive a bounded run on the committed corpus + fresh
  # mutations. A crash (panic escaping the containment guards, or invalid
  # output shipped) fails the job; artifacts land in fuzz/artifacts and are
  # uploaded on failure so discoveries can be committed back to the corpus
  # as regression seeds (the pull-back loop). fuzz-nightly.yml runs all five
  # targets plus ASan at 600 s each.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # nightly
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Smoke - make_valid (Auto/Arrange/Structure contract)
        run: cargo fuzz run make_valid -- -runs=500 -max_len=1024
      - name: Smoke - wkt_repair (parse + repair pipeline)
        run: cargo fuzz run wkt_repair -- -runs=500 -max_len=2048
      - name: Upload crash artifacts (pull-back loop)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/**
          if-no-files-found: ignore
