name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

# All actions SHA-pinned (supply-chain gate 3: unpinned refs are mutable
# supply-chain risk; pins verified against the tagged release HEADs on
# 2026-08-04). Bump by re-resolving the tag, never by trusting a new tag.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - run: cargo check --features "arrange,structure,parallel,simd,io-geojson,io-wkt,io-wkb,io-csv,io-gpkg,io-gml,ffi"
        env:
          RUSTFLAGS: -Dwarnings
      # Version drift gate: the maturin pyproject version must track
      # Cargo.toml (published wheels and the crate share a version).
      - run: |
          cargo_v=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          py_v=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$cargo_v" != "$py_v" ]; then
            echo "version drift: Cargo.toml=$cargo_v pyproject.toml=$py_v"
            exit 1
          fi

  # MSRV gate: the crate declares rust-version = 1.88 (the floor set by
  # geo 0.33.1); this job proves the declared feature set still builds on
  # it. Deviations from the CI feature list are deliberate: io backends and
  # ffi pull newer transitive deps.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # 1.88
        with:
          toolchain: "1.88"
      - run: cargo check --features "arrange,structure,parallel,simd,validate"
      - run: cargo check --features "arrange,structure,parallel,simd,validate,geo-traits"

  # no_std gate: alloc-only builds (std feature off) must compile. The bare
  # zero-feature config and a validate-only validator config are both
  # supported; the repair features imply each other (see Cargo.toml).
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features validate
      - run: cargo check --no-default-features --features validate,structure,arrange

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libgeos-dev geos-bin
      - run: cargo test --features "arrange,structure,parallel,simd,io-geojson,io-wkt,io-wkb,io-csv,io-gpkg,io-gml,ffi"

  test-no-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libgeos-dev geos-bin
      - run: cargo test --no-default-features --features "arrange,structure,parallel,simd,validate"

  # Python bindings gate: build the maturin wheel and run the WKT-surface
  # test suite (tests/test_python.py) against the real wheel.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b  # v7
        with:
          python-version: "3.13"
      - run: pip install maturin pytest
      - run: maturin build --release
      - run: pip install --force-reinstall target/wheels/*.whl
      - run: pytest tests/test_python.py -q

  # Real-GEOS oracle gate: runs geos_compare (geosop makeValid comparisons on
  # every fixture), alaska_fixture (GEOS-validity + area-preservation on the
  # real-world dataset) and geos_differential (random-polygon differential
  # fuzz: one-directional invariants vs GEOS isValid, repair output must be
  # GEOS-valid, no panics) against the system GEOS install. geosop and the
  # alaska test data are committed; alaska.bin is regenerable via
  # scripts/convert_shp_to_bin.py.
  test-geos-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libgeos-dev geos-bin
      - run: cargo test --features "arrange,structure,parallel,simd,validate,bench-geos-system" --test geos_compare --test alaska_fixture
      - name: Differential fuzz vs GEOS (one-directional invariants)
        run: cargo test --features "arrange,structure,parallel,simd,validate,bench-geos-system" --test geos_differential
        env:
          PROPTEST_CASES: 1000

  test-serde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - run: cargo check --features "serde"

  # Regression smoke for the dual-bar benchmarks: the synthetic sweep (all
  # shape families, serial vs parallel) and the real-world sample bench
  # (committed alaska subset, Structure vs GEOS). No hard timing gate -
  # runner noise makes absolute thresholds meaningless - but compile
  # breakage, panics, or GEOS-link failures fail the job. The committed
  # alaska.* set is a SMALL sample (the full 1,579,030-part dataset is
  # 748 MB and stays local; the bench defaults to data_0.gpkg there).
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libgeos-dev
      - name: Synthetic bench (serial vs parallel sweep)
        run: cargo bench --bench bench
      - name: Real-world sample bench (alaska subset, Structure vs GEOS)
        run: cargo bench --features "arrange,structure,parallel,simd,bench-geos-system,io-gpkg" --bench real_world -- --fast
        env:
          BENCH_FILE: benches/real_world/alaska.bin
      - name: WKB/WKT head-to-head bench (ours vs georust/wkb + wkt)
        run: cargo bench --bench wkb_cmp
        env:
          BENCH_FILE: benches/real_world/alaska.bin

  # Regression gate: the synthetic bench's curated subset must stay within
  # threshold of the committed baseline (recorded on this runner type).
  # Added 2026-08-07 after the LineString validity-contract fix shipped a
  # 35x valid-line regression with a fully green CI - nothing measured the
  # bench, so nothing caught it. First run on a new baseline records it;
  # commit the artifact to benches/bench_baseline.json.
  bench-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - name: Synthetic bench subset (gate)
        run: cargo bench --features arrange,structure,parallel,simd --bench bench
        env:
          BENCH_SUBSET: "valid polygon 1000v,valid polygon 5000v,valid polygon 10000v,invalid bowtie 4v,invalid bowtie 50v,invalid bowtie 100v,invalid bowtie 500v,spaghetti 500v,self-touch poly,valid ls 100v,valid ls 500v,collinear ls 500v,duped ls 100v,dense self ls 500v,lissajous 2000v,mls 50x3v,self-int mls 50x4v,hole hier 50h,overlap mp 50sh,dense grid 10x10=100,dense grid 20x20=400,sliver 500v"
          BENCH_JSON: target/bench_gate.json
      - name: Compare against baseline
        run: python scripts/bench_gate.py --json target/bench_gate.json --baseline benches/bench_baseline.json
      - name: Upload recorded baseline (when the first run created it)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: bench-baseline
          path: benches/bench_baseline.json
          if-no-files-found: ignore
          retention-days: 7

  # WebAssembly gate: the crate claims wasm32 support (default features
  # minus C-bound deps; the `wasm` feature adds browser fetch). Both the
  # full default feature set and the minimal wasm config must compile, and
  # the runtime suite (tests/wasm.rs) must PASS in Node via
  # wasm-bindgen-test-runner - compile-only wasm support rots (the
  # mimalloc E0433 was only found the first time the target was actually
  # checked, 2026-08-06).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown
      - run: cargo check --target wasm32-unknown-unknown --no-default-features --features "std,arrange,structure,simd,validate,wasm"
      - name: Install wasm-bindgen-test-runner (version-locked to the lockfile)
        run: |
          wb=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | sed 's/version = "\(.*\)"/\1/')
          cargo install wasm-bindgen-cli --version "$wb" --locked
      - name: Runtime wasm tests in Node
        run: cargo test --target wasm32-unknown-unknown --features "arrange,structure,simd,validate,wasm" --test wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  # C FFI gate: build the cdylib/staticlib and compile + run the C
  # harness (tests/c/test_geo_repair.c) against it on Linux and Windows
  # on every push. This catches ABI/layout drift at commit time, not at
  # release time (the release workflow re-runs the harness on macOS too).
  c-ffi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - run: cargo build --release --features ffi
      - name: Compile + run C harness (Linux)
        if: runner.os != 'Windows'
        run: |
          gcc -std=c99 -Wall -Wextra -I include tests/c/test_geo_repair.c \
            -L target/release -l geo_repair -o target/release/gr_test
          LD_LIBRARY_PATH=target/release target/release/gr_test
      - name: Compile + run C harness (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: tests\c\build_test_windows.bat

  # Lint gate: rustfmt + clippy on ALL targets (lib, tests, benches,
  # examples) under the full non-GEOS feature set. --all-targets matches
  # the geo ecosystem's gate (geo, wkt run it) - the CI feature set is the
  # one the test job uses, so every target that ships gets linted.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (all targets)
        run: cargo clippy --features "arrange,structure,parallel,simd,io-geojson,io-wkt,io-wkb,io-csv,io-gpkg,io-gml,ffi" --all-targets -- -D warnings

  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - run: cargo doc --features "arrange,structure,parallel,simd,io-geojson,io-wkt,io-wkb,io-csv,io-gpkg,io-gml,ffi,serde"
        env:
          RUSTDOCFLAGS: -D warnings

  # docs.rs build gate (the wkt crate's practice): the
  # [package.metadata.docs.rs] feature set must actually build. The
  # publish path only discovers a broken docs.rs config at release time;
  # this catches it at commit time. Nightly, because docs.rs builds on
  # nightly. cargo-docs-rs reads the metadata's all-features=false +
  # pinned feature list, so simd-portable and bench-geos-system never
  # leak into the docs build.
  docs-rs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # nightly
        with:
          toolchain: nightly
      - uses: dtolnay/install@a75ae3c3a13004d4d2db69b04946c7f7687bda91  # cargo-docs-rs
        with:
          crate: cargo-docs-rs
      - run: cargo docs-rs

  # Static-GEOS gate: the bench-geos feature (geos-src cmake static
  # build) is untested anywhere - CI only exercised bench-geos-system
  # (the geos crate's CI runs both). A broken cmake/static linkage
  # otherwise ships silently until a hermetic user hits it.
  geos-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cargo check --features "arrange,structure,parallel,simd,validate,bench-geos"

  # Semver gate: a minor/patch bump must never silently break the public
  # API. `check-release` compares the working tree against the latest
  # crates.io release of geo-repair (self-updating - no per-release
  # baseline to bump). Runs on push AND pull_request: when the local
  # version equals the published one the check is a no-op.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check release API compatibility
        run: cargo semver-checks check-release

  # Supply-chain gate 1: RustSec advisory database (known vulnerabilities
  # in the dependency graph fail the build).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit

  # Supply-chain gate 2: license policy + sources + advisories via
  # cargo-deny (policy in deny.toml at the repo root). Explicit install +
  # invocation: the cargo-deny-action bundle historically shipped an old
  # cargo-deny whose `check` rejected the multi-check argument form
  # (measured 2026-08-04: "unrecognized subcommand 'licenses'" with
  # command=check + arguments="licenses advisories sources").
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Deny checks
        run: cargo deny check licenses advisories sources

  # libFuzzer smoke gate: the repair entry points must build under
  # cargo-fuzz and survive a bounded run on the committed corpus + fresh
  # mutations. A crash (panic escaping the containment guards, or invalid
  # output shipped) fails the job; artifacts land in fuzz/artifacts and are
  # uploaded on failure so discoveries can be committed back to the corpus
  # as regression seeds (the pull-back loop).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # nightly
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Smoke - make_valid (Auto/Arrange/Structure contract)
        run: cargo fuzz run make_valid -- -runs=3000 -max_len=1024
      - name: Smoke - validate (panic-free + valid-input preservation)
        run: cargo fuzz run validate -- -runs=3000 -max_len=1024
      - name: Smoke - wkt_repair (parse + repair pipeline)
        run: cargo fuzz run wkt_repair -- -runs=3000 -max_len=2048
      - name: Smoke - wkb_repair (parse + repair pipeline)
        run: cargo fuzz run wkb_repair -- -runs=3000 -max_len=2048
      - name: Smoke - roundtrip (serialize + repair invariants)
        run: cargo fuzz run roundtrip -- -runs=3000 -max_len=2048
      # Sanitized pass: AddressSanitizer on make_valid (the 2026-08-04
      # mixed-magnitude deadly signal was unreproducible on Windows - the
      # sanitizer pinpoints heap/stack corruption that plain runs only
      # surface as a late signal). Corpus seeds replay first, so a
      # committed crash seed deterministically exercises the instrumented
      # build. cargo-fuzz 0.13 accepts only address/leak/memory/thread
      # (no 'undefined' - UBSan is not supported by libFuzzer's runner).
      - name: Sanitized - make_valid (ASan)
        run: cargo fuzz run --sanitizer address make_valid -- -runs=2000 -max_len=1024
      - name: Upload crash artifacts (pull-back loop)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/**
          if-no-files-found: ignore
