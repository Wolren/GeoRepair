name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Is your feature request related to a problem? What is the use case?
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      options:
        - Validation / OGC rules
        - Polygon repair (Structure or Arrange)
        - Line / Point repair
        - I/O format support
        - Python bindings / FFI
        - Performance / SIMD
        - Documentation
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else have you considered?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or references
